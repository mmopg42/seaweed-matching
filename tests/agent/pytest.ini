[pytest]
testpaths = .
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    -v
    --strict-markers
    --tb=short
    --html=reports/report.html
    --self-contained-html
markers =
    order: Test execution order dependency
    slow: Marks tests as slow (deselect with -m "not slow")
    destructive: Tests that modify data
asyncio_mode = auto
